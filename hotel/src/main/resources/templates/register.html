<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --white:#ffffff;
            --lightgray:#f5f5f7;
            --blue:#007aff;
            --blue-2:#5ac8fa;
            --dark:#1d1d1f;
            --muted:#6e6e73;
            --glass-bg: rgba(255,255,255,0.15);
            --glass-bg-strong: rgba(255,255,255,0.35);
            --glass-border: rgba(255,255,255,0.35);
            --field-border: rgba(29,29,31,0.10);
            --radius-card: 28px;
            --radius-field: 16px;
            --radius-pill: 999px;
            --shadow-card: 0 30px 80px -20px rgba(31,38,135,0.25), 0 10px 30px -10px rgba(0,0,0,0.08);
        }

        *{ box-sizing:border-box; }

        html,body{
            height:100%;
            margin:0;
            font-family:'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            color:var(--dark);
            -webkit-font-smoothing:antialiased;
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
            overflow-x:hidden;
            background:
                    radial-gradient(circle at 15% 20%, #eaf4ff 0%, transparent 45%),
                    radial-gradient(circle at 85% 15%, #f1ecff 0%, transparent 50%),
                    radial-gradient(circle at 50% 100%, #eef6ff 0%, transparent 55%),
                    linear-gradient(160deg, #ffffff 0%, #f5f5f7 55%, #eef2f7 100%);
            position:relative;
        }

        /* Ambient blurred blobs */
        .blob{
            position:fixed;
            border-radius:50%;
            filter:blur(80px);
            opacity:0.55;
            z-index:0;
            pointer-events:none;
            will-change:transform;
        }
        .blob-1{
            width:420px;height:420px;
            top:-120px; left:-100px;
            background:radial-gradient(circle, #a6d8ff 0%, transparent 70%);
            animation: float1 22s ease-in-out infinite;
        }
        .blob-2{
            width:460px;height:460px;
            bottom:-160px; right:-120px;
            background:radial-gradient(circle, #d9c9ff 0%, transparent 70%);
            animation: float2 26s ease-in-out infinite;
        }
        .blob-3{
            width:320px;height:320px;
            top:40%; right:8%;
            background:radial-gradient(circle, #bfe7ff 0%, transparent 70%);
            animation: float3 18s ease-in-out infinite;
        }

        @keyframes float1{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(40px,60px) scale(1.08); }
        }
        @keyframes float2{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(-50px,-30px) scale(1.05); }
        }
        @keyframes float3{
            0%,100%{ transform:translate(0,0) scale(1); }
            50%{ transform:translate(-30px,40px) scale(0.95); }
        }

        @media (prefers-reduced-motion: reduce){
            .blob{ animation:none !important; }
            *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
        }

        /* Card */
        .card{
            position:relative;
            z-index:1;
            width:100%;
            max-width:440px;
            background:var(--glass-bg);
            backdrop-filter:blur(24px) saturate(180%);
            -webkit-backdrop-filter:blur(24px) saturate(180%);
            border:1px solid var(--glass-border);
            border-radius:var(--radius-card);
            box-shadow:var(--shadow-card);
            padding:44px 36px 34px;
            opacity:0;
            transform:translateY(24px);
            animation: cardIn 0.8s cubic-bezier(.16,1,.3,1) forwards;
            animation-delay:0.05s;
        }

        @keyframes cardIn{
            to{ opacity:1; transform:translateY(0); }
        }

        .logo{
            width:52px;height:52px;
            margin:0 auto 18px;
            border-radius:16px;
            background:linear-gradient(135deg, var(--blue), var(--blue-2));
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 8px 20px -6px rgba(0,122,255,0.55);
        }
        .logo svg{ width:26px; height:26px; }

        h1.title{
            margin:0;
            text-align:center;
            font-family:'Poppins', 'Inter', sans-serif;
            font-weight:700;
            font-size:26px;
            letter-spacing:-0.02em;
            color:var(--dark);
        }
        p.subtitle{
            margin:8px 0 30px;
            text-align:center;
            font-size:14.5px;
            color:var(--muted);
            font-weight:500;
        }

        form{ display:flex; flex-direction:column; gap:16px; }

        .field{
            position:relative;
        }
        .field input{
            width:100%;
            padding:14px 16px 14px 46px;
            font-size:15px;
            font-family:inherit;
            font-weight:500;
            color:var(--dark);
            background:rgba(255,255,255,0.55);
            border:1px solid var(--field-border);
            border-radius:var(--radius-field);
            outline:none;
            backdrop-filter:blur(6px);
            transition: box-shadow 300ms ease, border-color 300ms ease, background 300ms ease, transform 150ms ease;
        }
        .field input::placeholder{
            color:#9a9aa0;
            font-weight:450;
        }
        .field input:hover{
            background:rgba(255,255,255,0.7);
        }
        .field input:focus{
            background:rgba(255,255,255,0.85);
            border-color:rgba(0,122,255,0.55);
            box-shadow:0 0 0 4px rgba(0,122,255,0.14), 0 0 18px rgba(0,122,255,0.18);
        }

        .field .icon{
            position:absolute;
            left:16px; top:50%;
            transform:translateY(-50%);
            width:18px; height:18px;
            color:#9a9aa0;
            pointer-events:none;
            transition: color 300ms ease;
        }
        .field input:focus ~ .icon{ color:var(--blue); }

        .field .toggle-visibility{
            position:absolute;
            right:14px; top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            cursor:pointer;
            color:#9a9aa0;
            padding:4px;
            display:flex;
            transition:color 200ms ease;
        }
        .field .toggle-visibility:hover{ color:var(--dark); }

        .hint{
            font-size:12px;
            color:var(--muted);
            margin:2px 2px 0;
            min-height:14px;
            transition: color 200ms ease;
        }
        .hint.match{ color:#1fae57; }
        .hint.mismatch{ color:#e5484d; }

        .primary-btn{
            margin-top:8px;
            width:100%;
            padding:15px 20px;
            border:none;
            border-radius:var(--radius-pill);
            background:linear-gradient(135deg, var(--blue), #4aa8ff);
            color:#fff;
            font-family:inherit;
            font-size:15.5px;
            font-weight:700;
            letter-spacing:0.01em;
            cursor:pointer;
            box-shadow:0 12px 28px -8px rgba(0,122,255,0.55);
            transition: transform 220ms cubic-bezier(.16,1,.3,1), box-shadow 220ms ease, filter 220ms ease;
            position:relative;
            overflow:hidden;
        }
        .primary-btn:hover{
            transform:translateY(-2px) scale(1.01);
            box-shadow:0 16px 34px -8px rgba(0,122,255,0.65);
        }
        .primary-btn:active{
            transform:translateY(0) scale(0.98);
            filter:brightness(0.96);
        }
        .primary-btn .ripple{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.55);
            transform:scale(0);
            animation:ripple 600ms ease-out forwards;
            pointer-events:none;
        }
        @keyframes ripple{
            to{ transform:scale(3); opacity:0; }
        }

        .divider{
            display:flex;
            align-items:center;
            gap:12px;
            margin:22px 0 16px;
        }
        .divider::before, .divider::after{
            content:"";
            flex:1;
            height:1px;
            background:rgba(29,29,31,0.12);
        }
        .divider span{
            font-size:12px;
            color:var(--muted);
            font-weight:600;
            letter-spacing:0.04em;
        }

        .social-row{
            display:flex;
            gap:10px;
        }
        .social-btn{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:12px 10px;
            border-radius:14px;
            border:1px solid var(--field-border);
            background:rgba(255,255,255,0.45);
            backdrop-filter:blur(6px);
            cursor:pointer;
            transition: transform 200ms ease, background 200ms ease, box-shadow 200ms ease;
        }
        .social-btn:hover{
            transform:translateY(-2px);
            background:rgba(255,255,255,0.75);
            box-shadow:0 8px 18px -8px rgba(0,0,0,0.18);
        }
        .social-btn svg{ width:18px; height:18px; }

        .footer-text{
            text-align:center;
            margin-top:26px;
            font-size:13.5px;
            color:var(--muted);
            font-weight:500;
        }
        .footer-text a{
            color:var(--blue);
            text-decoration:none;
            font-weight:700;
            margin-left:4px;
        }
        .footer-text a:hover{ text-decoration:underline; }

        @media (max-width:480px){
            .card{ padding:36px 24px 28px; border-radius:22px; }
            h1.title{ font-size:22px; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="card" role="main">

    <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2 L14.5 8.5 L21 11 L14.5 13.5 L12 20 L9.5 13.5 L3 11 L9.5 8.5 Z" fill="white"/>
        </svg>
    </div>

    <h1 class="title">Create Account</h1>
    <p class="subtitle">Join us and start your journey.</p>

    <form th:action="@{/register}" th:object="${user}" method="post" novalidate>

        <div class="field">
            <input type="text" name="name" id="name" placeholder="Full Name" autocomplete="name" required/>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>

        <div class="field">
            <input type="email" name="email" id="email" placeholder="Email Address" autocomplete="email" required/>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"/>
                <path d="m3 7 9 6 9-6"/>
            </svg>
        </div>

        <div class="field">
            <input type="text" name="phone" id="phone" placeholder="Phone Number" autocomplete="tel" required/>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.99.3 1.95.6 2.87a2 2 0 0 1-.45 2.11L8.1 9.8a16 16 0 0 0 6 6l1.12-1.15a2 2 0 0 1 2.11-.45c.92.3 1.88.5 2.87.6A2 2 0 0 1 22 16.9Z"/>
            </svg>
        </div>

        <div class="field">
            <input type="password" name="password" id="password" placeholder="Password" autocomplete="new-password" required/>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2.5"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <button type="button" class="toggle-visibility" data-target="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>

        <div class="field">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" required/>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2.5"/>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>
        <div class="hint" id="matchHint">&nbsp;</div>

        <button type="submit" class="primary-btn" id="submitBtn">Create Account</button>
    </form>

    <div class="divider"><span>OR</span></div>

    <div class="social-row">
        <button type="button" class="social-btn" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.73-2.46 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.11A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.61H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.39l4-3.11z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.27 6.61l4 3.11C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        </button>
        <button type="button" class="social-btn" aria-label="Continue with Apple">
            <svg viewBox="0 0 24 24"><path fill="#1d1d1f" d="M16.36 1.43c0 1.1-.4 2.02-1.2 2.85-.85.9-1.9 1.44-3.02 1.35-.1-1.07.4-2.16 1.13-2.9.81-.85 2.2-1.5 3.09-1.3zm3.36 16.7c-.45 1.02-.67 1.47-1.25 2.38-.81 1.26-1.96 2.83-3.38 2.84-1.26.02-1.59-.83-3.3-.82-1.72.01-2.08.84-3.34.82-1.42-.02-2.51-1.43-3.32-2.69-2.28-3.55-2.52-7.71-1.11-9.93.99-1.57 2.56-2.5 4.03-2.5 1.5 0 2.44.83 3.68.83 1.2 0 1.93-.83 3.68-.83 1.31 0 2.69.71 3.68 1.94-3.24 1.78-2.72 6.4.63 7.96z"/></svg>
        </button>
        <button type="button" class="social-btn" aria-label="Continue with GitHub">
            <svg viewBox="0 0 24 24"><path fill="#1d1d1f" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.6 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"/></svg>
        </button>
    </div>

    <p class="footer-text">Already have an account?<a href="#" th:href="@{/log-in}">Sign In</a></p>

</div>

<script>
    // Show/hide password toggles
    document.querySelectorAll('.toggle-visibility').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            const input = document.getElementById(btn.dataset.target);
            input.type = input.type === 'password' ? 'text' : 'password';
        });
    });

    // Confirm password live match hint (client-side UX only)
    const pw = document.getElementById('password');
    const cpw = document.getElementById('confirmPassword');
    const hint = document.getElementById('matchHint');

    function checkMatch(){
        if(!cpw.value){ hint.textContent = '\u00A0'; hint.className='hint'; return; }
        if(pw.value === cpw.value){
            hint.textContent = 'Passwords match';
            hint.className = 'hint match';
        } else {
            hint.textContent = 'Passwords do not match';
            hint.className = 'hint mismatch';
        }
    }
    pw.addEventListener('input', checkMatch);
    cpw.addEventListener('input', checkMatch);

    // Ripple effect + guard against mismatched passwords
    const form = document.querySelector('form');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', function(e){
        if(pw.value !== cpw.value){
            e.preventDefault();
            checkMatch();
            cpw.focus();
            return;
        }
        const rect = submitBtn.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
        submitBtn.appendChild(ripple);
        setTimeout(()=> ripple.remove(), 650);
    });
</script>

</body>
</html>
